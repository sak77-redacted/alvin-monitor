name: edge-prep-cron

# Sunday 11:55 UTC = 19:55 HKT (UTC+8, no DST). Runs 5 minutes before the
# weekly edge-mining agent so the prep blob is freshly written when the agent
# reads /api/edge-prep?week=current at 12:00 UTC.
#
# Reuses the existing CRON_SECRET (same value as the 5-min check / daily /
# digest crons). Auth follows the same Authorization: Bearer header convention.

on:
  schedule:
    - cron: '55 11 * * 0'
  workflow_dispatch:

jobs:
  prep:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Hit /api/cron/edge-prep
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET secret missing"; exit 1
          fi
          HOST="${DEPLOY_HOST:-https://alvin-monitor.vercel.app}"
          response=$(curl -sS -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            -w "\n--- HTTP %{http_code} · %{time_total}s\n" \
            "$HOST/api/cron/edge-prep")
          echo "$response"
          status=$(echo "$response" | grep -oE 'HTTP [0-9]+' | tail -1 | awk '{print $2}')
          if [ "$status" != "200" ]; then
            echo "::error::edge-prep endpoint returned $status"; exit 1
          fi
